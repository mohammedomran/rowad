<!doctype html>
<html lang="ar" dir="rtl" data-auth="guest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تسجيل الدخول — رواد</title>
  <meta name="description" content="سجّل الدخول إلى رواد لتكمل الحكايات مع طفلك.">
  <meta name="theme-color" content="#b9e3ff">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="رواد">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&display=swap">
  <link rel="stylesheet" href="assets/css/rowad.css">
  <script src="assets/js/guard.js"></script>
</head>
<body class="auth" data-page="login">
  <script src="assets/js/icons.js"></script>
  <div class="sky" aria-hidden="true">
    <span class="cloud cloud--1"></span><span class="cloud cloud--2"></span><span class="cloud cloud--3"></span><span class="cloud cloud--4"></span>
  </div>

  <main class="auth__wrap" id="main">
    <a class="auth__logo" href="index.html" aria-label="رواد — الصفحة الرئيسية">
      <img src="assets/img/brand/logo-280.webp" alt="رواد" width="280" height="215">
    </a>

    <section class="auth__card" aria-labelledby="authTitle">
      <img class="auth__mascot" src="assets/img/icons/robo-wave.webp" alt="" width="320" height="320">

      <div class="auth__head" id="authHead">
        <h1 class="h1" id="authTitle">أهلًا بعودتك</h1>
        <p>سجّل الدخول لتكمل الحكايات.</p>
      </div>

      <div class="alert" id="formAlert" role="alert" hidden style="margin-bottom:18px">
        <svg class="ico" aria-hidden="true"><use href="#i-warning-circle-fill"/></svg>
        <span>تعذّر تسجيل الدخول. تحقق من البريد وكلمة المرور ثم أعد المحاولة.</span>
      </div>

      <form class="auth__form" id="loginForm" novalidate>
        <div class="field">
          <label class="field__label" for="email">البريد الإلكتروني</label>
          <div class="field__control">
            <svg class="ico field__icon" aria-hidden="true"><use href="#i-envelope-simple"/></svg>
            <input class="input" id="email" name="email" type="email" inputmode="email" dir="ltr" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="name@example.com" aria-describedby="emailErr" required>
          </div>
          <p class="field__error" id="emailErr" aria-live="polite"></p>
        </div>

        <div class="field">
          <label class="field__label" for="password">كلمة المرور</label>
          <div class="field__control">
            <svg class="ico field__icon" aria-hidden="true"><use href="#i-lock-key"/></svg>
            <input class="input input--with-action" id="password" name="password" type="password" dir="ltr" autocomplete="current-password" aria-describedby="passwordErr" required>
            <button class="field__action" type="button" data-toggle-password="password" aria-pressed="false" aria-label="إظهار كلمة المرور">
              <svg class="ico" aria-hidden="true"><use href="#i-eye"/></svg>
            </button>
          </div>
          <p class="field__error" id="passwordErr" aria-live="polite"></p>
        </div>

        <div class="auth__row" style="justify-content:flex-end">
          <a class="link" href="forgot-password.html">نسيت كلمة المرور؟</a>
        </div>

        <button class="btn btn--sun btn--lg btn--block" type="submit" id="submitBtn">تسجيل الدخول</button>
      </form>

      <p class="auth__alt" id="authAlt">ليس لديك حساب؟ <a class="link" href="signup.html">أنشئ حسابًا</a></p>
    </section>

    <aside class="auth__art" aria-hidden="true">
      <img class="auth__art-logo" src="assets/img/brand/logo.webp" alt="" width="560" height="430">
      <div class="auth__art-frame">
        <img src="assets/img/hero/robo-wide.webp" alt="" width="1536" height="1024">
      </div>
      <p>حكايات تنمّي الخيال وتغرس القيم</p>
    </aside>
  </main>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
  <script src="assets/js/pwa.js" defer></script>
</body>
</html>
