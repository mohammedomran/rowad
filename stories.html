  <meta name="description" content="مكتبة قصص رواد: مغامرات، قصص قبل النوم، قصص القيم وقصص الحيوانات.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#b9e3ff">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="app" data-page="stories">

  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

  <header class="topbar" id="topbar"></header>

  <main class="main stack" id="main">
    <div class="page-head">
      <h1 class="h1">كل القصص</h1>
      <p class="result-count" id="resultCount" aria-live="polite"></p>
    </div>

    <form class="search page-search" role="search" action="stories.html">
      <label class="sr-only" for="q">ابحث عن قصة</label>
      <svg class="ico" aria-hidden="true"><use href="#i-magnifying-glass"/></svg>
      <input id="q" type="search" name="q" placeholder="ابحث عن قصة…" autocomplete="off" enterkeyhint="search">

    <div class="chips" id="catChips" role="group" aria-label="التصنيف"></div>

    <div class="grid-stories" id="grid"></div>

    <div class="empty card" id="noResults" hidden>
      <img src="assets/img/icons/robo-wave.webp" alt="" width="240" height="240">
      <h2 class="h2">لم نجد قصة بهذا الاسم</h2>
      <p>جرّب كلمة أخرى أو اختر تصنيفًا آخر.</p>
      <button class="btn btn--sun" type="button" id="resetFilters">
        <svg class="ico" aria-hidden="true"><use href="#i-squares-four-fill"/></svg>عرض كل القصص
      </button>
    </div>
  </main>

  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/pages.js" defer></script>
